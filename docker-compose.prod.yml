services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: app
    image: gtin-reserve/app:prod
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app
    volumes:
      - app-storage:/var/www/html/storage
      - app-cache:/var/www/html/bootstrap/cache

  nginx:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: nginx
    image: gtin-reserve/nginx:prod
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - app

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  app:
    driver: bridge

volumes:
  app-storage:
  app-cache:
  redis-data:
